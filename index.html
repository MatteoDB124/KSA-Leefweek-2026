<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leefweek scorebord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#0F3B2E;
  --pine-soft:#17543F;
  --sand:#F4EAD5;
  --paper:#FBF5E9;
  --clay:#C7481F;
  --gold:#E9A21C;
  --ink:#101A16;
  --line:rgba(15,59,46,.18);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  background:var(--paper);color:var(--ink);
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 18px 80px}
.hide{display:none !important}

header{background:var(--pine);color:var(--sand);padding:18px 0 0;border-bottom-left-radius:24px;border-bottom-right-radius:24px;overflow:hidden}
.hbar{max-width:900px;margin:0 auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hbar h1{margin:0;font-size:clamp(26px,6vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1}
.keybtn{border:1.5px solid rgba(244,234,213,.45);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--sand);white-space:nowrap}
.keybtn:hover{background:rgba(244,234,213,.15)}
#banner{width:100%;height:150px;object-fit:cover;display:block;margin-top:16px}
nav{max-width:900px;margin:0 auto;padding:14px 18px 16px;display:flex;gap:8px;overflow-x:auto}
nav button{padding:9px 15px;border-radius:999px;background:rgba(244,234,213,.14);color:var(--sand);font-weight:600;font-size:15px;white-space:nowrap}
nav button[aria-current="true"]{background:var(--sand);color:var(--pine)}

section h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:26px 0 12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 160px;min-width:0}
.muted{color:var(--pine-soft);font-size:14px}
.empty{border:2px dashed var(--line);border-radius:18px;padding:26px 18px;text-align:center;color:var(--pine-soft)}
.field{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:var(--r);background:#fff}
.field:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--pine)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:var(--r);background:var(--pine);color:var(--sand);font-weight:600}
.btn:hover{background:var(--pine-soft)}
.btn.full{width:100%;margin-top:12px}
.btn.ghost{background:#fff;color:var(--pine);border:2px solid var(--line)}
.btn.danger{background:var(--clay);color:#fff}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.err{color:var(--clay);font-weight:600;margin-top:10px;min-height:20px;font-size:14px}

.rank{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);margin-bottom:8px}
.rank .pos{font-size:22px;font-weight:800;width:30px;text-align:center;color:var(--pine-soft)}
.rank .nm{flex:1;font-weight:600;font-size:18px;min-width:0}
.rank .name-btn{padding:0;text-align:left;font-weight:inherit;font-size:inherit}
.rank .name-btn:hover{text-decoration:underline}
.rank .pt{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:var(--sand);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.leader{background:var(--pine);color:var(--sand);border-color:var(--pine)}
.leader .pos{color:var(--gold)}
.leader .bar{background:rgba(244,234,213,.25)}

.task{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.task .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.task h3{margin:0;font-size:18px;font-weight:600}
.pts{background:var(--gold);color:var(--ink);font-weight:800;border-radius:999px;padding:3px 11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pts.neg{background:var(--clay);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:2px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:600;font-size:15px;background:#fff}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--sand)}
.chip:disabled{cursor:default}
.chip:disabled[aria-pressed="false"]{opacity:.45}

.shirt-grid{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;font-weight:600;position:sticky;left:0;background:#fff}
th{font-size:13px;font-weight:600;color:var(--pine-soft)}
.sbtn{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);font-weight:800;font-size:13px;background:#fff}
.sbtn:disabled{cursor:default}
.sbtn:disabled:not(.on){opacity:.4}
.sbtn.on[data-s="aan"]{background:var(--pine);border-color:var(--pine);color:var(--sand)}
.sbtn.on[data-s="mee"]{background:var(--gold);border-color:var(--gold)}
.sbtn.on[data-s="niets"]{background:var(--clay);border-color:var(--clay);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--pine-soft);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:5px;display:inline-block}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gal figure{margin:0;position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--sand)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal button{position:absolute;top:6px;right:6px;background:rgba(16,26,22,.75);color:#fff;border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600}
.info-photo{display:block;margin:18px 0}
.info-photo figure{width:100%;aspect-ratio:16/9;border-radius:18px}

.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.list-item .nm{flex:1;font-weight:600}
.profile-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.profile-total{font-size:30px;font-weight:800;color:var(--pine)}
.status-list{display:grid;gap:8px}
.status-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.status-row:last-child{border-bottom:none}

#modal{position:fixed;inset:0;background:rgba(16,26,22,.6);display:flex;align-items:center;justify-content:center;padding:22px;z-index:9}
.sheet{width:100%;max-width:360px;background:var(--paper);border-radius:20px;padding:24px;box-shadow:0 18px 40px rgba(0,0,0,.3)}
.sheet h2{margin:0 0 4px;font-size:24px}
.sheet p{margin:0 0 18px;color:var(--pine-soft);font-size:15px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.who button{border:2px solid var(--line);border-radius:var(--r);padding:13px 8px;font-weight:600;background:#fff}
.who button[aria-pressed="true"]{border-color:var(--pine);background:var(--pine);color:var(--sand)}

@media (max-width:520px){ .who{grid-template-columns:1fr 1fr} .rank .nm{font-size:16px} }
@media (prefers-reduced-motion:no-preference){ .btn,.chip,.sbtn,.keybtn{transition:background .15s ease,color .15s ease,border-color .15s ease} }
</style>
</head>
<body>

<header>
  <div class="hbar">
    <h1 id="appTitle">Leefweek</h1>
    <button class="keybtn" id="keyBtn">Beheer</button>
  </div>
  <img id="banner" class="hide" alt="">
  <nav id="tabs"></nav>
</header>

<div class="wrap"><section id="view"></section></div>

<div id="modal" class="hide">
  <div class="sheet">
    <h2>Beheer</h2>
    <p>Enkel voor Matteo en Femke.</p>
    <div class="who">
      <button type="button" data-u="matteo" aria-pressed="true">Matteo</button>
      <button type="button" data-u="femke" aria-pressed="false">Femke</button>
    </div>
    <input id="pw" class="field" type="password" inputmode="numeric" placeholder="Wachtwoord" autocomplete="off">
    <button class="btn full" id="doLogin">Aanmelden</button>
    <button class="btn ghost full" id="closeModal">Terug</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<script>
"use strict";
const KEY="leefweek_v1", PASS="97531";
const SYNC_URL="https://ksa---leefweek---2026-default-rtdb.europe-west1.firebasedatabase.app/";
const SHIRT={ aan:{label:"Aan",pts:100}, mee:{label:"Mee",pts:50}, niets:{label:"Niks",pts:-100} };

const blank=()=>({ title:"Leefweek", users:[], tasks:[], days:[], photos:[], pw:{matteo:PASS,femke:PASS} });
let state=blank(), me=null, picked="matteo", tab="info";

const isAdmin=()=>me==="matteo";
const canEdit=()=>isAdmin();
const canAddTask=()=>me==="matteo"||me==="femke";
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);

async function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r) state=Object.assign(blank(),JSON.parse(r));
  }catch(e){ state=blank(); }
  if(SYNC_URL){
    try{
      const r=await fetch(SYNC_URL.replace(/\/$/,"")+"/leefweek.json");
      if(r.ok){
        const remote=await r.json();
        if(remote) state=Object.assign(blank(),remote);
      }
    }catch(e){}
  }
  state.pw=Object.assign({matteo:PASS,femke:PASS}, state.pw||{});
  saveLocal();
}
function saveLocal(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }
  catch(e){ alert("Opslaan lukte niet. Waarschijnlijk is het geheugen vol door te veel foto's."); }
}
function save(){
  saveLocal();
  if(SYNC_URL){
    fetch(SYNC_URL.replace(/\/$/,"")+"/leefweek.json",{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(state)
    }).catch(()=>{});
  }
}

function points(id){
  let p=0;
  state.tasks.forEach(t=>{ if(t.done.includes(id)) p+=Number(t.points)||0; });
  state.days.forEach(d=>{ const s=d.status[id]; if(s&&SHIRT[s]) p+=SHIRT[s].pts; });
  return p;
}
const ranked=()=>state.users.map(u=>({...u,p:points(u.id)})).sort((a,b)=>b.p-a.p||a.name.localeCompare(b.name));

/* ---------- aanmelden ---------- */
$("#keyBtn").onclick=()=>{
  if(me){ me=null; sessionStorage.removeItem("lw_me"); tab="ranking"; renderAll(); return; }
  $("#modal").classList.remove("hide"); $("#loginErr").textContent=""; $("#pw").value=""; $("#pw").focus();
};
$("#closeModal").onclick=()=>$("#modal").classList.add("hide");
document.querySelectorAll(".who button").forEach(b=>b.onclick=()=>{
  picked=b.dataset.u;
  document.querySelectorAll(".who button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  $("#pw").focus();
});
$("#pw").addEventListener("keydown",e=>{ if(e.key==="Enter") tryLogin(); });
$("#doLogin").onclick=tryLogin;
function tryLogin(){
  if($("#pw").value.trim()!==state.pw[picked]){ $("#loginErr").textContent="Wachtwoord klopt niet."; $("#pw").select(); return; }
  me=picked; sessionStorage.setItem("lw_me",me);
  $("#modal").classList.add("hide");
  tab=isAdmin()?"admin":"tasks";
  renderAll();
}

/* ---------- chrome ---------- */
function renderAll(){
  $("#appTitle").textContent=state.title||"Leefweek";
  document.title=(state.title||"Leefweek")+" scorebord";
  const b=$("#banner");
  if(state.photos.length){ b.src=state.photos[0]; b.classList.remove("hide"); } else b.classList.add("hide");
  $("#keyBtn").textContent = me ? (me==="matteo"?"Matteo · afmelden":"Femke · afmelden") : "Beheer";

  const items=[["info","Info"],["ranking","Stand"],["tasks","Opdrachten"],["shirt","Hemd"]];
  if(me) items.push(["admin","Beheer"]);
  if(!items.some(i=>i[0]===tab) && tab!=="profile") tab="info";
  $("#tabs").innerHTML=items.map(([k,l])=>`<button data-t="${k}" aria-current="${k===tab}">${l}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(btn=>btn.onclick=()=>{ tab=btn.dataset.t; renderAll(); });

  ({ranking:viewRanking,tasks:viewTasks,shirt:viewShirt,info:viewInfo,profile:viewProfile,admin:viewAdmin}[tab]||viewRanking)();
}

/* ---------- stand ---------- */
function viewRanking(){
  const list=ranked(), max=Math.max(1,...list.map(u=>Math.abs(u.p)));
  let html=`<h2>Stand</h2>`;
  html += list.length ? list.map((u,i)=>`
    <div class="rank ${i===0?"leader":""}">
      <div class="pos">${i+1}</div>
      <div class="nm"><button class="name-btn" data-profile="${u.id}">${esc(u.name)}</button><div class="bar"><i style="width:${Math.max(2,Math.round(Math.max(u.p,0)/max*100))}%"></i></div></div>
      <div class="pt">${u.p}</div>
    </div>`).join("") : `<div class="empty">Nog geen deelnemers.</div>`;
  if(state.photos.length>1)
    html+=`<h2>Foto's</h2><div class="gal">`+state.photos.slice(1).map(p=>`<figure><img src="${p}" alt=""></figure>`).join("")+`</div>`;
  $("#view").innerHTML=html;
  $("#view").querySelectorAll("[data-profile]").forEach(b=>b.onclick=()=>{ selectedProfile=b.dataset.profile; tab="profile"; renderAll(); });
}

let selectedProfile=null;

function viewProfile(){
  const user=state.users.find(u=>u.id===selectedProfile);
  if(!user){ tab="ranking"; return renderAll(); }
  const completed=state.tasks.filter(t=>t.done.includes(user.id));
  const statusRows=state.days.length?state.days.map(d=>{
    const status=SHIRT[d.status[user.id]];
    return `<div class="status-row"><span>${esc(d.name)}</span><strong>${status?`${status.label} (${status.pts>0?"+":""}${status.pts})`:"Nog niet ingevuld"}</strong></div>`;
  }).join(""):"<p class=\"muted\">Nog geen hemdstatussen ingevuld.</p>";
  $("#view").innerHTML=`
    <button class="btn ghost sm" id="backRanking">Terug naar stand</button>
    <div class="profile-head"><h2>${esc(user.name)}</h2><div class="profile-total">${points(user.id)} ptn</div></div>
    <h2>Opdrachten</h2>
    <div class="panel">${completed.length?completed.map(t=>`<div class="status-row"><span>${esc(t.title)}</span><strong>${t.points>0?"+":""}${t.points} punten</strong></div>`).join(""):"<p class=\"muted\">Deze deelnemer heeft nog geen opdrachten voltooid.</p>"}</div>
    <h2>Hemdstatus</h2>
    <div class="panel status-list">${statusRows}</div>`;
  $("#backRanking").onclick=()=>{ tab="ranking"; renderAll(); };
}

function viewInfo(){
  const photos=["fotos/Afbeelding%20(6).jpg","fotos/Afbeelding(1)%20(2).jpg","fotos/Afbeelding(2)%20(1).jpg"];
  $("#view").innerHTML=`
    <h2>Welkom bij onze Leefweek!</h2>
    <div class="panel">
      <p><strong>Dit is onze Leefweek:</strong> een week vol plezier, samenwerking, uitdagingen en leuke momenten samen. Plezier staat bij ons helemaal bovenaan. Doe mee, moedig elkaar aan en maak er samen een geweldige week van.</p>
      <p style="margin-bottom:0">Tijdens de Leefweek verzamel je punten door opdrachten uit te voeren en goed voorbereid aan elke dag te beginnen. Op het einde wint de deelnemer met de meeste punten een leuke prijs.</p>
    </div>
    <div class="gal info-photo"><figure><img src="${photos[0]}" alt="Foto van onze Leefweek"></figure></div>
    <h2>Hoe werkt het?</h2>
    <div class="panel">
      <p><strong>1. Bekijk de stand:</strong> bij <strong>Stand</strong> zie je de ranglijst en het aantal punten van iedereen. Klik op een naam om het persoonlijke profiel te bekijken.</p>
      <p><strong>2. Doe opdrachten:</strong> bij <strong>Opdrachten</strong> staan de uitdagingen van de Leefweek. De beheerders houden bij wie een opdracht heeft voltooid.</p>
      <p><strong>3. Kom in orde met je hemd:</strong> bij <strong>Hemd</strong> zie je per dag of iemand het hemd aan had, mee had of niks had.</p>
      <p style="margin-bottom:0"><strong>4. Ga voor de overwinning:</strong> alle punten worden opgeteld. Wie op het einde bovenaan staat, wint de prijs.</p>
    </div>
    <div class="gal info-photo"><figure><img src="${photos[1]}" alt="Activiteit tijdens onze Leefweek"></figure></div>
    <h2>Het puntensysteem</h2>
    <div class="panel">
      <p><strong>Opdrachten:</strong> elke opdracht heeft een eigen puntenwaarde. Die waarde staat naast de opdracht.</p>
      <p><strong>Hemd aan:</strong> +100 punten.</p>
      <p><strong>Hemd mee:</strong> +50 punten.</p>
      <p><strong>Niks bij:</strong> -100 punten.</p>
      <p style="margin-bottom:0">Je totale score is de som van je voltooide opdrachten en je hemdpunten. Klik in de stand op je naam om precies te zien hoe jouw score is opgebouwd.</p>
    </div>
    <div class="gal info-photo"><figure><img src="${photos[2]}" alt="Samen plezier maken tijdens onze Leefweek"></figure></div>
    <h2>Wie beheert de Leefweek?</h2>
    <div class="panel">
      <p>De beheerders zijn <strong>Matteo en Femke</strong>. Zij voegen deelnemers, opdrachten en dagen toe, houden de scores bij en beheren de foto's.</p>
      <p style="margin-bottom:0">Heb je een vraag of klopt er iets niet? Spreek Matteo of Femke aan. Veel plezier en succes met de opdrachten!</p>
    </div>`;
}

/* ---------- opdrachten ---------- */
function viewTasks(){
  let html="";
  if(canAddTask()){
    html+=`<h2>Nieuwe opdracht</h2>
    <div class="panel">
      <div class="row">
        <input id="tTitle" class="field grow" placeholder="Wat moet er gebeuren?">
        <input id="tPts" class="field" type="number" step="10" value="50" style="width:110px" aria-label="Punten">
        <button class="btn" id="tAdd">Toevoegen</button>
      </div>
      <p class="muted" style="margin:10px 0 0">Negatieve punten mogen ook, typ dan bijvoorbeeld -50.</p>
    </div>`;
  }
  html+=`<h2>Opdrachten</h2>`;
  if(!state.tasks.length){
    html+=`<div class="empty">Nog geen opdrachten.</div>`;
  }else{
    html+=state.tasks.map(t=>`
      <div class="task">
        <div class="top">
          <h3>${esc(t.title)}</h3>
          <div class="row" style="gap:8px">
            <span class="pts ${t.points<0?"neg":""}">${t.points>0?"+":""}${t.points}</span>
            ${canEdit()?`<button class="btn ghost sm" data-del="${t.id}">Wis</button>`:""}
          </div>
        </div>
        ${state.users.length?`<div class="chips">`+state.users.map(u=>`
          <button class="chip" data-task="${t.id}" data-user="${u.id}"
            aria-pressed="${t.done.includes(u.id)}" ${canEdit()?"":"disabled"}>${esc(u.name)}</button>`).join("")+`</div>`
          :`<p class="muted" style="margin:10px 0 0">Nog geen deelnemers.</p>`}
      </div>`).join("");
  }
  $("#view").innerHTML=html;

  if(canAddTask()){
    $("#tAdd").onclick=()=>{
      const title=$("#tTitle").value.trim();
      if(!title){ $("#tTitle").focus(); return; }
      state.tasks.unshift({ id:uid(), title, points:Number($("#tPts").value)||0, done:[] });
      save(); viewTasks();
    };
    $("#tTitle").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#tAdd").click(); });
  }
  $("#view").querySelectorAll("[data-task]:not([disabled])").forEach(c=>c.onclick=()=>{
    const t=state.tasks.find(x=>x.id===c.dataset.task), i=t.done.indexOf(c.dataset.user);
    i<0?t.done.push(c.dataset.user):t.done.splice(i,1);
    save(); viewTasks();
  });
  $("#view").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(!confirm("Deze opdracht wissen? De punten ervan verdwijnen ook.")) return;
    state.tasks=state.tasks.filter(t=>t.id!==b.dataset.del);
    save(); viewTasks();
  });
}

/* ---------- hemd ---------- */
function viewShirt(){
  let html=`<h2>Hemd per dag</h2>`;
  if(canEdit()){
    html+=`<div class="panel"><div class="row">
      <input id="dName" class="field grow" placeholder="Dag, bv. maandag">
      <button class="btn" id="dAdd">Dag toevoegen</button></div></div>`;
  }
  if(!state.days.length||!state.users.length){
    html+=`<div class="empty">${!state.users.length?"Nog geen deelnemers.":"Nog geen dagen toegevoegd."}</div>`;
  }else{
    html+=`<div class="panel shirt-grid"><table><thead><tr><th>Naam</th>`+
      state.days.map(d=>`<th>${esc(d.name)}${canEdit()?`<br><button class="btn ghost sm" data-dday="${d.id}" style="margin-top:4px">wis</button>`:""}</th>`).join("")+
      `<th>Totaal</th></tr></thead><tbody>`+
      state.users.map(u=>`<tr><td>${esc(u.name)}</td>`+
        state.days.map(d=>`<td>`+Object.keys(SHIRT).map(s=>
          `<button class="sbtn ${d.status[u.id]===s?"on":""}" data-s="${s}" data-day="${d.id}" data-u="${u.id}"
           ${canEdit()?"":"disabled"} title="${SHIRT[s].label} (${SHIRT[s].pts>0?"+":""}${SHIRT[s].pts})">${SHIRT[s].label[0]}</button>`).join(" ")+`</td>`).join("")+
        `<td style="font-weight:800">${state.days.reduce((a,d)=>a+((SHIRT[d.status[u.id]]||{}).pts||0),0)}</td></tr>`).join("")+
      `</tbody></table></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--pine)"></i>A = aan, +100</span>
        <span><i class="dot" style="background:var(--gold)"></i>M = mee, +50</span>
        <span><i class="dot" style="background:var(--clay)"></i>N = niks, -100</span>
      </div>`;
    if(canEdit()) html+=`<p class="muted">Klik nog eens op dezelfde knop om de dag leeg te maken.</p>`;
  }
  $("#view").innerHTML=html;

  if(canEdit()){
    $("#dAdd").onclick=()=>{
      const name=$("#dName").value.trim(); if(!name) return;
      state.days.push({ id:uid(), name, status:{} }); save(); viewShirt();
    };
    $("#dName").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#dAdd").click(); });
    $("#view").querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
      const d=state.days.find(x=>x.id===b.dataset.day);
      d.status[b.dataset.u]=d.status[b.dataset.u]===b.dataset.s?undefined:b.dataset.s;
      save(); viewShirt();
    });
    $("#view").querySelectorAll("[data-dday]").forEach(b=>b.onclick=()=>{
      if(!confirm("Deze dag wissen?")) return;
      state.days=state.days.filter(d=>d.id!==b.dataset.dday); save(); viewShirt();
    });
  }
}

/* ---------- beheer ---------- */
const pwPanel=()=>`
    <h2>Mijn wachtwoord</h2>
    <div class="panel">
      <div class="row">
        <input id="pwNew" class="field grow" type="text" inputmode="numeric" placeholder="Nieuw wachtwoord">
        <button class="btn" id="pwSave">Opslaan</button>
      </div>
      <p class="muted" id="pwMsg" style="margin:10px 0 0">Dit verandert alleen het wachtwoord van ${me==="matteo"?"Matteo":"Femke"}.</p>
    </div>`;

function bindPw(){
  const btn=$("#pwSave"); if(!btn) return;
  btn.onclick=()=>{
    const v=$("#pwNew").value.trim();
    if(v.length<4){ $("#pwMsg").textContent="Kies een wachtwoord van minstens 4 tekens."; return; }
    state.pw[me]=v; save();
    $("#pwNew").value=""; $("#pwMsg").textContent="Wachtwoord aangepast.";
  };
  $("#pwNew").addEventListener("keydown",e=>{ if(e.key==="Enter") btn.click(); });
}

function viewAdmin(){
  if(!me){ tab="ranking"; return renderAll(); }
  if(!isAdmin()){ $("#view").innerHTML=pwPanel(); bindPw(); return; }
  $("#view").innerHTML=`
    <h2>Deelnemers</h2>
    <div class="panel">
      <div class="row"><input id="uName" class="field grow" placeholder="Naam"><button class="btn" id="uAdd">Toevoegen</button></div>
      <div style="margin-top:8px">${state.users.length
        ? state.users.map(u=>`<div class="list-item"><span class="nm">${esc(u.name)}</span><span class="muted">${points(u.id)} ptn</span><button class="btn ghost sm" data-du="${u.id}">Wis</button></div>`).join("")
        : `<p class="muted" style="margin:6px 0 0">Nog niemand toegevoegd.</p>`}</div>
    </div>

    <h2>Foto's</h2>
    <div class="panel">
      <input id="pic" type="file" accept="image/*" multiple>
      <p class="muted" style="margin:8px 0 12px">De eerste foto staat bovenaan als banner, de rest komt bij de stand.</p>
      <div class="gal">${state.photos.map((p,i)=>`<figure><img src="${p}" alt=""><button data-dp="${i}">wis</button></figure>`).join("")}</div>
    </div>

    <h2>Naam van de week</h2>
    <div class="panel"><div class="row">
      <input id="wTitle" class="field grow" value="${esc(state.title)}"><button class="btn" id="wSave">Opslaan</button>
    </div></div>

    <h2>Back-up</h2>
    <div class="panel">
      <p class="muted" style="margin:0 0 12px">Alles staat in deze browser. Exporteer een bestand om het op een ander toestel binnen te halen.</p>
      <div class="row">
        <button class="btn ghost" id="exp">Exporteren</button>
        <button class="btn ghost" id="impBtn">Importeren</button>
        <input id="imp" type="file" accept="application/json" class="hide">
      </div>
    </div>

    <h2>Opkuisen</h2>
    <div class="panel">
      <div class="row"><button class="btn ghost" id="clrPts">Vinkjes leegmaken</button><button class="btn danger" id="clrAll">Alles wissen</button></div>
      <p class="muted" style="margin:10px 0 0">Vinkjes leegmaken zet iedereen op nul, maar houdt de deelnemers en opdrachten.</p>
    </div>`+pwPanel();
  bindPw();

  $("#uAdd").onclick=()=>{
    const name=$("#uName").value.trim(); if(!name) return;
    state.users.push({ id:uid(), name }); save(); viewAdmin();
  };
  $("#uName").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#uAdd").click(); });
  $("#view").querySelectorAll("[data-du]").forEach(b=>b.onclick=()=>{
    if(!confirm("Deze deelnemer wissen?")) return;
    state.users=state.users.filter(u=>u.id!==b.dataset.du);
    state.tasks.forEach(t=>t.done=t.done.filter(x=>x!==b.dataset.du));
    state.days.forEach(d=>delete d.status[b.dataset.du]);
    save(); viewAdmin();
  });
  $("#pic").onchange=async e=>{ for(const f of e.target.files) state.photos.push(await shrink(f)); save(); renderAll(); };
  $("#view").querySelectorAll("[data-dp]").forEach(b=>b.onclick=()=>{ state.photos.splice(Number(b.dataset.dp),1); save(); renderAll(); });
  $("#wSave").onclick=()=>{ state.title=$("#wTitle").value.trim()||"Leefweek"; save(); renderAll(); };
  $("#exp").onclick=()=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:"application/json"}));
    a.download="leefweek-backup.json"; a.click();
  };
  $("#impBtn").onclick=()=>$("#imp").click();
  $("#imp").onchange=async e=>{
    try{ state=Object.assign(blank(),JSON.parse(await e.target.files[0].text())); save(); renderAll(); }
    catch(err){ alert("Dat bestand kon ik niet lezen. Kies een back-up die hier geëxporteerd is."); }
  };
  $("#clrPts").onclick=()=>{
    if(!confirm("Alle vinkjes en hemddagen leegmaken?")) return;
    state.tasks.forEach(t=>t.done=[]); state.days.forEach(d=>d.status={}); save(); renderAll();
  };
  $("#clrAll").onclick=()=>{
    if(!confirm("Alles wissen: deelnemers, opdrachten, dagen en foto's?")) return;
    if(!confirm("Zeker? Dit kan je niet ongedaan maken.")) return;
    const keep=state.pw; state=blank(); state.pw=keep; save(); renderAll();
  };
}

function shrink(file){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const max=1200, sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=img.width*sc; c.height=img.height*sc;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.72));
    };
    img.src=URL.createObjectURL(file);
  });
}

(async()=>{
  await load();
  me=sessionStorage.getItem("lw_me")||null;
  renderAll();
})();
</script>
</body>
</html>
